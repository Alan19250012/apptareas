<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="description" content="Hábitat — Rastreador visual de hábitos con calendario, agenda, rachas, estadísticas y panel de progreso. Funciona sin conexión y se instala como app." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hábitat" />
  <title>Hábitat · Rastreador de Hábitos</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🗓️</span>
        <div class="brand-text">
          <strong>Hábitat</strong>
          <span>Rastreador de hábitos</span>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-level" class="chip chip-level" title="Nivel y experiencia" type="button">
          <span class="chip-icon">⭐</span>
          <span id="level-label">Nv. 1</span>
          <span class="xp-bar" aria-hidden="true"><span id="xp-fill"></span></span>
        </button>
        <button id="btn-theme" class="icon-btn" title="Cambiar tema" type="button" aria-label="Cambiar tema">🌙</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidenav" aria-label="Navegación principal">
        <button class="nav-item is-active" data-view="dashboard" type="button">
          <span class="nav-ico">📊</span><span>Progreso</span>
        </button>
        <button class="nav-item" data-view="calendar" type="button">
          <span class="nav-ico">📅</span><span>Calendario</span>
        </button>
        <button class="nav-item" data-view="agenda" type="button">
          <span class="nav-ico">🗓️</span><span>Agenda</span>
        </button>
        <button class="nav-item" data-view="habits" type="button">
          <span class="nav-ico">✅</span><span>Hábitos</span>
        </button>
        <button class="nav-item" data-view="stats" type="button">
          <span class="nav-ico">📈</span><span>Estadísticas</span>
        </button>
        <button class="nav-item" data-view="settings" type="button">
          <span class="nav-ico">⚙️</span><span>Ajustes</span>
        </button>
      </nav>

      <main class="content">
        <section id="view-dashboard" class="view is-active"></section>
        <section id="view-calendar" class="view"></section>
        <section id="view-agenda" class="view"></section>
        <section id="view-habits" class="view"></section>
        <section id="view-stats" class="view"></section>
        <section id="view-settings" class="view"></section>
      </main>
    </div>

    <nav class="tabbar" aria-label="Navegación inferior">
      <button class="nav-item is-active" data-view="dashboard" type="button"><span class="nav-ico">📊</span><span>Progreso</span></button>
      <button class="nav-item" data-view="calendar" type="button"><span class="nav-ico">📅</span><span>Calendario</span></button>
      <button class="nav-item" data-view="agenda" type="button"><span class="nav-ico">🗓️</span><span>Agenda</span></button>
      <button class="nav-item" data-view="habits" type="button"><span class="nav-ico">✅</span><span>Hábitos</span></button>
      <button class="nav-item" data-view="stats" type="button"><span class="nav-ico">📈</span><span>Stats</span></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
